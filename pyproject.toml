[project]
name = "smoke-localisation"
version = "0.1.0"
description = "Geolocate smoke from a single Pyronear camera frame"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "ncnn>=1.0.20260114",
    "numpy>=2.4.4",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "streamlit>=1.56.0",
    "streamlit-folium>=0.27.1",
    "streamlit-image-coordinates>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smoke_localisation"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
